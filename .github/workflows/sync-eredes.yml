name: Sincronizar cortes programados (E-Redes)

on:
  schedule:
    # 06:00, 12:00, 18:00 e 22:00 UTC — o Vercel Cron (grátis) já trata
    # das 06:00; isto cobre as outras 3 vezes sem precisar de plano pago.
    - cron: "0 6,12,18,22 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/sync/eredes
        run: |
          status=$(curl -s -o /tmp/resposta.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL || 'https://alertas-pt.vercel.app' }}/api/sync/eredes")
          echo "status HTTP: $status"
          cat /tmp/resposta.json
          if [ "$status" -ge 300 ]; then
            echo "sincronização falhou"
            exit 1
          fi
